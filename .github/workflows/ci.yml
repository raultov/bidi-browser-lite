name: CI
on:
  push:
    branches: [ "master", "phase-*" ]
    # A master push releases a new Cargo.toml version; a version tag
    # (re)releases that tag. Both only once every check passes.
    tags: [ "v*" ]
  pull_request: { branches: [ "master" ] }
  # Releases a tag that already exists (its checks run first, on that tag's code).
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to release, e.g. v0.1.0"
        required: true
env:
  CARGO_TERM_COLOR: always
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --all-features
      - name: Doc
        shell: bash
        run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --all-features
  dupes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Duplication
        run: make dupes
  firefox:
    # The #[ignore]d real-Firefox tests (tests/e2e_real_firefox.rs), headless,
    # against a Firefox installed by the action, on Linux and Windows. macOS
    # runs only the hermetic checks above: real-browser support there is
    # untested. The last step fails if any Firefox process outlived the tests
    # (Windows: the Job Object must take the whole process tree down).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: browser-actions/setup-firefox@0bc507ddf224827e3b1af68e014d5e42ab93e795 # v1.7.2
        with:
          firefox-version: latest
      - name: Real-Firefox tests (headless)
        env:
          BIDI_BROWSER_LITE_HEADLESS: "1"
        run: cargo test --all-features --test e2e_real_firefox -- --ignored --test-threads=1
      - name: No Firefox process left behind (Linux)
        if: runner.os == 'Linux'
        run: sleep 2; if pgrep -a firefox; then exit 1; fi
      - name: No Firefox process left behind (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Start-Sleep -Seconds 2
          $left = Get-Process firefox -ErrorAction SilentlyContinue
          if ($left) { $left | Format-Table Id, ProcessName; exit 1 }
  release:
    # Every push to master releases the Cargo.toml version if it has no GitHub
    # release yet (the tag is created on that commit); pushes that do not bump
    # the version skip. A pushed v* tag, or a dispatch, (re)releases that tag.
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/master')
      || startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    needs: [check, dupes, firefox]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          # Empty on a master push: the tag then comes from Cargo.toml.
          REQUESTED_TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name || '') }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          tag="v$version"
          if [ -n "$REQUESTED_TAG" ] && [ "$REQUESTED_TAG" != "$tag" ]; then
            echo "Tag $REQUESTED_TAG does not match the version in Cargo.toml ($version)" >&2
            exit 1
          fi

          # A master push never moves or re-releases an existing version.
          if [ -z "$REQUESTED_TAG" ]; then
            if gh release view "$tag" > /dev/null 2>&1; then
              echo "$tag is already released; bump the version to release again"
              exit 0
            fi
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
              echo "::warning::tag $tag exists without a release; bump the version, or release it with workflow_dispatch"
              exit 0
            fi
          fi

          # The release notes are this version's section of CHANGELOG.md.
          awk -v heading="## [$version]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi
          printf '\nhttps://crates.io/crates/bidi-browser-lite/%s\n' "$version" >> notes.md

          title="bidi-browser-lite $version"
          if [ -z "$REQUESTED_TAG" ]; then
            # Creates the tag on the commit that passed every check.
            gh release create "$tag" --target "$GITHUB_SHA" --title "$title" --notes-file notes.md
          elif gh release view "$tag" > /dev/null 2>&1; then
            gh release edit "$tag" --title "$title" --notes-file notes.md
          else
            gh release create "$tag" --verify-tag --title "$title" --notes-file notes.md
          fi
