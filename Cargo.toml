[package]
name = "bidi-browser-lite"
version = "0.1.4"
edition = "2024"
rust-version = "1.98"
authors = ["Raul Tovar <raultov@protonmail.com>"]
description = "Full lifecycle control of WebDriver BiDi browsers (Firefox): discovery, launch, profiles, ports, one shared BiDi session and the optional Firefox debugger port, on top of bidi-lite."
readme = "README.md"
repository = "https://github.com/raultov/bidi-browser-lite"
license = "MIT"
keywords = ["webdriver", "bidi", "firefox", "browser", "automation"]
categories = ["web-programming", "development-tools::testing", "asynchronous"]
exclude = [".gitignore", ".github/*", "examples/*", "docs/*", "tests/*", "Makefile", "dupes.toml", "clippy.toml", "AGENTS.md"]

[features]
# In-process BiDi/RDP mocks and the `fake_firefox_helper` binary, for this
# crate's tests and for downstream crates that test without a real Firefox.
test-support = ["dep:tokio-tungstenite", "dep:futures-util"]

# Test double standing in for Firefox: serves the BiDi/RDP mocks on the ports
# given on its command line. Driven by FAKE_FIREFOX_MODE.
[[bin]]
name = "fake_firefox_helper"
path = "src/bin/fake_firefox_helper.rs"
required-features = ["test-support"]

# Integration tests spawning the fake helper: one binary, a module per area.
[[test]]
name = "integration"
path = "tests/integration/main.rs"
required-features = ["test-support"]

[lints.rust]
# No-unsafe policy (AGENTS.md). `deny` rather than `forbid`: an audited
# exception would need `#[expect(unsafe_code, reason = "...")]`.
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
# Readability gates. Thresholds live in clippy.toml; these lints are
# allow-by-default (pedantic/nursery), so they are inert without this.
too_many_lines = "warn"
cognitive_complexity = "warn"

# Ban bare `#[allow]` in favour of `#[expect(..., reason = "...")]`.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"

# Library hygiene: a panic in a library is a bug the caller cannot handle.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

# cdp-browser-lite needed `#[expect]` for these; this crate must pass clean.
struct_excessive_bools = "warn"
fn_params_excessive_bools = "warn"

[dependencies]
bidi-lite = "0.1.3"
tokio = { version = "1.53.2", features = ["process", "net", "time", "fs", "io-util", "sync", "macros", "rt-multi-thread", "signal"] }
thiserror = "2.0.21"
tracing = "0.1.44"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
tokio-tungstenite = { version = "0.30.0", optional = true }
futures-util = { version = "0.3.34", optional = true, default-features = false, features = ["sink", "std"] }

# Job Objects: kill Firefox together with every process it starts.
[target.'cfg(windows)'.dependencies]
win32job = "2.0.3"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.3", features = ["signal", "process"] }

[dev-dependencies]
# The mocks are also compiled for this crate's own unit tests (cfg(test)).
tokio-tungstenite = "0.30.0"
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
